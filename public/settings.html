<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统设置 · LUCKY</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23b93a2c'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='serif'>幸</text></svg>">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .set-row { display: flex; align-items: flex-start; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line-2); }
  .set-row:last-child { border-bottom: none; }
  .set-row .st { flex: 1; }
  .set-row .st b { display: block; font-size: 13.5px; font-weight: 500; }
  .set-row .st span { font-size: 12px; color: var(--muted); line-height: 1.7; display: block; margin-top: 2px; }
  .danger-zone { border-color: #f0dbd6; background: linear-gradient(180deg, #fff, #fdf7f5); }
  .act-list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-2); }
  .act-list-item:last-child { border-bottom: none; }
  .act-list-item .an { font-weight: 500; }
  .act-list-item .am { font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page narrow" id="page"><div class="empty">正在载入…</div></div>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
(function () {
  let snap = null;
  let settings = null;
  const $ = (s) => document.querySelector(s);

  async function load() {
    snap = await LK.get(`/api/activities/${LK.state.activityId}/snapshot`);
    settings = snap.settings;
    render();
  }

  function render() {
    LK.mountShell({ active: 'settings', title: '系统设置', sub: '', actions: '' });
    $('#topbar').innerHTML = `
      <div><h1>系统设置</h1><div class="sub">活动规则、访问保护与数据管理</div></div>
      <div class="topbar-actions"><button class="btn btn-sm" data-act="new-act">${LK.icon('plus', 14)} 新建活动</button></div>`;

    const act = snap.activity;
    $('#page').innerHTML = `
      <div class="card" style="margin-bottom:18px">
        <div class="card-head"><h2>活动信息</h2><span class="hint">活动码 ${act.code}</span></div>
        <div class="card-body">
          <div class="row" style="gap:14px;align-items:flex-end">
            <div class="field" style="flex:1">
              <label>活动名称</label>
              <input class="input" id="setName" value="${LK.esc(act.name)}" maxlength="40">
            </div>
            <button class="btn btn-primary" data-act="save-name">保存名称</button>
          </div>
          <div class="divider"></div>
          <div class="row" style="gap:40px">
            <div><div class="small muted">活动状态</div><div style="margin-top:4px"><span class="chip ${act.status}">${LK.STATUS_TEXT[act.status]}</span></div></div>
            <div><div class="small muted">参与者</div><div style="margin-top:4px;font-weight:600">${snap.stats.totalParticipants} 人</div></div>
            <div><div class="small muted">已中奖</div><div style="margin-top:4px;font-weight:600">${snap.stats.uniqueWinners} 人</div></div>
            <div><div class="small muted">创建时间</div><div style="margin-top:4px;font-size:12.5px">${LK.fmtFull(act.createdAt)}</div></div>
            <div class="spacer"></div>
            <div class="small muted" style="text-align:right">参与者入口<br><span style="color:var(--ink-2)">${LK.esc(LK.joinUrl(act.code))}</span></div>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div style="display:flex;flex-direction:column;gap:18px">
          <div class="card">
            <div class="card-head"><h2>抽奖规则</h2></div>
            <div class="card-body" style="padding-top:4px">
              <div class="set-row">
                <div class="st"><b>允许同一人重复中奖</b><span>关闭时，已中奖的参与者不再进入后续轮次的抽选池，覆盖更多人。</span></div>
                <label class="switch"><input type="checkbox" id="ruleDup" ${act.settings.allowDuplicateWin ? 'checked' : ''}><span class="track"></span></label>
              </div>
              <div class="set-row">
                <div class="st"><b>结束轮次时自动作废未揭晓名额</b><span>关闭后，结束轮次若仍有未刮卡的名额，需要主持人逐条处理。</span></div>
                <label class="switch"><input type="checkbox" id="ruleAutoVoid" ${act.settings.autoVoidOnClose ? 'checked' : ''}><span class="track"></span></label>
              </div>
              <div class="banner" style="margin-top:14px">${LK.icon('info')} 规则调整只影响之后开启的轮次，已产生的记录不会改变。</div>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><h2>现场大屏</h2></div>
            <div class="card-body" style="padding-top:4px">
              <div class="set-row">
                <div class="st"><b>揭晓音效</b><span>大屏揭晓中奖者时播放提示音，需要在现场电脑上手动开启一次。</span></div>
                <label class="switch"><input type="checkbox" id="setSound" ${settings.sound ? 'checked' : ''}><span class="track"></span></label>
              </div>
              <div class="row" style="margin-top:12px;gap:8px">
                <a class="btn btn-sm" href="/screen" target="_blank">${LK.icon('monitor', 14)} 打开大屏</a>
                <button class="btn btn-sm" data-act="copy-link">${LK.icon('copy', 14)} 复制参与链接</button>
              </div>
            </div>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:18px">
          <div class="card">
            <div class="card-head"><h2>主持人台保护</h2></div>
            <div class="card-body" style="padding-top:4px">
              <div class="set-row">
                <div class="st"><b>开启操作密码</b><span>开启后，开奖、作废、设置等操作需要输入密码，避免误触或被他人操作。</span></div>
                <label class="switch"><input type="checkbox" id="setPinOn" ${settings.adminPinEnabled ? 'checked' : ''}><span class="track"></span></label>
              </div>
              <div class="field" style="margin-top:6px">
                <label>操作密码（4-8 位数字）</label>
                <input class="input" id="setPin" type="text" inputmode="numeric" maxlength="8" placeholder="${settings.hasPin ? '已设置，留空表示不修改' : '尚未设置'}">
              </div>
              <button class="btn btn-sm btn-primary" style="margin-top:12px" data-act="save-pin">保存密码设置</button>
              <div class="small muted" style="margin-top:10px">密码保存在本机数据文件中，请与现场负责人确认后再开启。</div>
            </div>
          </div>

          <div class="card danger-zone">
            <div class="card-head"><h2 style="color:var(--red)">数据管理</h2></div>
            <div class="card-body">
              <div class="row" style="gap:8px;flex-wrap:wrap">
                <a class="btn btn-sm" href="/api/backup.json${LK.state.pin ? '?pin=' + encodeURIComponent(LK.state.pin) : ''}">${LK.icon('download', 14)} 下载数据备份</a>
                <button class="btn btn-sm" data-act="export">导出中奖 Excel</button>
              </div>
              <div class="divider"></div>
              <div class="small muted" style="line-height:1.9">清空活动只删除当前活动的名单、奖项、轮次与记录；重置系统会删除全部活动。</div>
              <div class="row" style="gap:8px;margin-top:12px">
                <button class="btn btn-sm btn-danger" data-act="clear-act">清空当前活动</button>
                <button class="btn btn-sm btn-danger" data-act="reset-all">重置整个系统</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:18px">
        <div class="card-head"><h2>活动列表</h2><span class="hint">共 ${LK.state.boot.activities.length} 个活动</span>
          <button class="btn btn-sm" style="margin-left:auto" data-act="new-act">${LK.icon('plus', 13)} 新建</button>
        </div>
        <div class="card-body" style="padding-top:4px">
          ${LK.state.boot.activities.map((a) => `
            <div class="act-list-item">
              <div style="flex:1;min-width:0">
                <div class="an">${LK.esc(a.name)} ${a.id === act.id ? '<span class="chip red" style="margin-left:6px">当前</span>' : ''}</div>
                <div class="am">活动码 ${a.code} · ${a.participantCount} 人 · ${a.awardCount} 份中奖 · ${LK.STATUS_TEXT[a.status]}</div>
              </div>
              ${a.id === act.id ? '' : `<button class="btn btn-sm" data-act="switch" data-id="${a.id}">切换到此活动</button>`}
              ${a.awardCount === 0 && a.id !== act.id ? `<button class="btn btn-sm btn-ghost" data-act="del-act" data-id="${a.id}">删除</button>` : ''}
            </div>`).join('')}
        </div>
      </div>`;
  }

  function saveActivity(patch) {
    return LK.withPin(() => LK.patch(`/api/activities/${snap.activity.id}`, patch)).then(load);
  }

  async function saveSettings(patch) {
    return LK.withPin(() => LK.post('/api/settings', patch)).then((res) => {
      settings = res.settings;
    });
  }

  document.addEventListener('change', async (e) => {
    const id = e.target.id;
    if (id === 'ruleDup') {
      await saveActivity({ settings: { allowDuplicateWin: e.target.checked } });
      LK.toast('规则已更新', 'ok');
    }
    if (id === 'ruleAutoVoid') {
      await saveActivity({ settings: { autoVoidOnClose: e.target.checked } });
      LK.toast('规则已更新', 'ok');
    }
    if (id === 'setSound') {
      await saveSettings({ sound: e.target.checked });
      LK.toast('已保存', 'ok');
    }
    if (id === 'setPinOn') {
      await saveSettings({ adminPinEnabled: e.target.checked });
      LK.toast(e.target.checked ? '已开启操作密码' : '已关闭操作密码', 'ok');
      load();
    }
  });

  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;

    if (act === 'save-name') {
      const name = $('#setName').value.trim();
      if (!name) return LK.toast('活动名称不能为空', 'err');
      try {
        await saveActivity({ name });
        LK.toast('已保存', 'ok');
      } catch (err) { LK.toast(err.message, 'err'); }
      return;
    }

    if (act === 'save-pin') {
      const pin = $('#setPin').value.trim();
      const enabled = $('#setPinOn').checked;
      if (pin && !/^\d{4,8}$/.test(pin)) return LK.toast('密码需为 4-8 位数字', 'err');
      if (enabled && !pin && !settings.hasPin) return LK.toast('请先设置一个操作密码', 'err');
      try {
        const patch = { adminPinEnabled: enabled };
        if (pin) patch.adminPin = pin;
        await saveSettings(patch);
        if (pin) {
          LK.state.pin = pin;
          localStorage.setItem('lucky.pin', pin);
        }
        LK.toast('密码设置已保存', 'ok');
        load();
      } catch (err) { LK.toast(err.message, 'err'); }
      return;
    }

    if (act === 'copy-link') return LK.copy(LK.joinUrl(snap.activity.code));

    if (act === 'export') {
      const qs = new URLSearchParams({ activityId: snap.activity.id });
      if (LK.state.pin) qs.set('pin', LK.state.pin);
      const res = await fetch(`/api/export.xlsx?${qs}`);
      if (!res.ok) return LK.toast('导出失败，请确认密码', 'err');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `${snap.activity.name}-中奖记录.xlsx`; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return;
    }

    if (act === 'new-act') {
      const created = await LK.createActivityFlow();
      if (created) {
        await LK.post(`/api/activities/${created.id}/current`);
        location.reload();
      }
      return;
    }

    if (act === 'switch') {
      await LK.post(`/api/activities/${btn.dataset.id}/current`);
      location.reload();
      return;
    }

    if (act === 'clear-act') {
      const ok = await LK.confirm({
        title: '清空当前活动？',
        desc: `将删除「${snap.activity.name}」的 ${snap.stats.totalParticipants} 位参与者、${snap.prizes.length} 个奖项以及全部轮次与发奖记录。建议先下载数据备份。`,
        danger: true,
        okText: '仍要清空',
      });
      if (!ok) return;
      try {
        await LK.withPin(() => LK.post(`/api/activities/${snap.activity.id}/clear`));
        LK.toast('活动数据已清空', 'ok');
        load();
      } catch (err) { LK.toast(err.message, 'err'); }
      return;
    }

    if (act === 'reset-all') {
      LK.modal({
        title: '重置整个系统',
        desc: '所有活动、名单、奖项与发奖记录都会被删除，且无法恢复。请输入「重置」确认。',
        okText: '确认重置',
        width: 440,
        body: `<input class="input" id="resetWord" placeholder="输入：重置">`,
        onOk: async (mask, close) => {
          if (mask.querySelector('#resetWord').value.trim() !== '重置') {
            LK.toast('请输入「重置」两个字', 'err');
            return false;
          }
          await LK.withPin(() => LK.post('/api/data/reset'));
          close();
          LK.toast('系统已重置', 'ok');
          setTimeout(() => (location.href = '/'), 600);
        },
      });
      return;
    }

    if (act === 'del-act') {
      const a = LK.state.boot.activities.find((x) => x.id === btn.dataset.id);
      const ok = await LK.confirm({ title: `删除「${a.name}」？`, desc: '该活动没有发奖记录，删除后不可恢复。', danger: true, okText: '删除' });
      if (!ok) return;
      try {
        await LK.withPin(() => LK.del(`/api/activities/${a.id}`));
        LK.toast('已删除', 'ok');
        setTimeout(() => location.reload(), 500);
      } catch (err) { LK.toast(err.message, 'err'); }
    }
  });

  (async function () {
    await LK.ready();
    if (!LK.state.activityId) {
      $('#page').innerHTML = '<div class="blank"><h3>还没有活动</h3><p>创建一个活动开始使用。</p><button class="btn btn-primary" data-act="new-act" style="margin-top:16px">创建活动</button></div>';
      return;
    }
    await load();
  })();
})();
</script>
</body>
</html>
