<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>参与抽奖 · LUCKY</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23b93a2c'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='serif'>幸</text></svg>">
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #15151a;
    --cream: #f6f1e6;
    --cream-2: #cec6b8;
    --gold: #dfb46c;
    --gold-2: #b6883f;
    --red: #cf4a37;
    --font-display: "Songti SC", "Noto Serif SC", "STSong", serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--cream); font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(120% 55% at 50% -10%, rgba(207, 74, 55, .26), transparent 62%),
      radial-gradient(90% 40% at 90% 100%, rgba(182, 136, 63, .12), transparent 70%);
    background-attachment: fixed;
  }
  .phone { max-width: 460px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: max(18px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); }

  .p-head { display: flex; align-items: center; gap: 10px; padding: 4px 0 18px; }
  .p-mark {
    width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
    background: linear-gradient(145deg, #d0503c, #8e241a);
    font-family: var(--font-display); font-size: 16px; color: #fff;
    box-shadow: 0 6px 20px -6px rgba(207,74,55,.8);
  }
  .p-head .hn { font-size: 11px; letter-spacing: .28em; color: #8b8375; text-transform: uppercase; }
  .p-head .an { margin-left: auto; font-size: 12px; color: #9d9483; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; }

  /* 验证卡片 */
  .v-card {
    background: linear-gradient(180deg, #fbf7ee, #f3ecdd);
    color: #201d18; border-radius: 20px; padding: 26px 22px 22px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,.7), inset 0 1px 0 #fff;
    position: relative; overflow: hidden;
  }
  .v-card::before {
    content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%;
    right: -70px; top: -90px; background: radial-gradient(circle, rgba(207,74,55,.16), transparent 70%);
  }
  .v-eyebrow { font-size: 10.5px; letter-spacing: .26em; color: #a08c66; text-transform: uppercase; }
  .v-title { font-family: var(--font-display); font-size: 27px; line-height: 1.3; margin: 10px 0 6px; letter-spacing: .01em; }
  .v-desc { font-size: 12.5px; color: #7b7365; margin: 0 0 22px; line-height: 1.7; }
  .v-field { margin-bottom: 14px; }
  .v-field label { display: block; font-size: 11.5px; color: #857b69; margin-bottom: 6px; letter-spacing: .04em; }
  .v-input {
    width: 100%; height: 52px; border-radius: 12px; border: 1px solid #ded4c1;
    background: #fffdf8; padding: 0 15px; font-size: 17px; color: #1d1a15;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .v-input:focus { border-color: #c19a58; box-shadow: 0 0 0 3px rgba(193,154,88,.16); }
  .v-input::placeholder { color: #b9af9c; font-size: 14px; }
  .v-id { letter-spacing: .32em; font-family: "SF Mono", Menlo, monospace; font-size: 19px; }
  .v-id::placeholder { letter-spacing: normal; font-family: var(--font-sans); font-size: 14px; }
  .v-btn {
    width: 100%; height: 52px; border: none; border-radius: 12px; margin-top: 8px;
    background: linear-gradient(180deg, #d0503c, #a8301f); color: #fff;
    font-size: 15.5px; font-weight: 600; letter-spacing: .06em;
    box-shadow: 0 14px 30px -14px rgba(168,48,31,.9);
  }
  .v-btn:active { transform: translateY(1px); }
  .v-btn:disabled { opacity: .6; }
  .v-err {
    background: #fbe9e5; color: #a0301f; font-size: 12.5px; padding: 9px 12px;
    border-radius: 9px; margin-bottom: 14px; display: none; line-height: 1.6;
  }
  .v-err.on { display: block; animation: shake .3s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
  .v-foot { text-align: center; font-size: 10.5px; color: #a99e8a; margin-top: 16px; letter-spacing: .04em; }

  /* 等待 */
  .wait { text-align: center; padding: 10px 0; }
  .wait .ring { width: 118px; height: 118px; margin: 0 auto 26px; position: relative; }
  .wait .ring i { position: absolute; inset: 0; border: 1px solid rgba(223,180,108,.35); border-radius: 50%; animation: wr 3s ease-out infinite; }
  .wait .ring i:nth-child(2) { animation-delay: 1s; }
  .wait .ring i:nth-child(3) { animation-delay: 2s; }
  .wait .ring b {
    position: absolute; inset: 34px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #e2bd7e, #a97a34);
    font-family: var(--font-display); font-size: 22px; color: #2c1e08;
    box-shadow: 0 0 40px -6px rgba(223,180,108,.5);
  }
  @keyframes wr { 0% { transform: scale(.62); opacity: .9; } 100% { transform: scale(1.45); opacity: 0; } }
  .wait h2 { font-family: var(--font-display); font-size: 26px; font-weight: 600; margin: 0 0 8px; letter-spacing: .02em; }
  .wait .who { font-size: 13px; color: #a89e8c; margin: 0 0 4px; }
  .wait .who b { color: #e3d8c2; font-weight: 500; }
  .wait .note { font-size: 12.5px; color: #857c6b; margin-top: 18px; line-height: 1.8; }
  .wait .note strong { color: #c9a15f; font-weight: 500; }

  /* 刮卡 */
  .draw-card {
    background: #141418; border: 1px solid rgba(223,180,108,.26); border-radius: 22px;
    padding: 18px 18px 20px; box-shadow: 0 30px 70px -30px #000;
  }
  .dc-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
  .dc-round { font-size: 10px; letter-spacing: .24em; color: #8b8172; }
  .dc-prize { font-family: var(--font-display); font-size: 18px; color: #eeddbe; margin-left: auto; }
  .scratch-stage {
    position: relative; height: 196px; border-radius: 15px; overflow: hidden;
    background: radial-gradient(120% 120% at 50% 0%, #211d16, #100f0c);
    border: 1px solid rgba(255,255,255,.05);
  }
  .under {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
  }
  .under .q { font-family: var(--font-display); font-size: 46px; color: rgba(223,180,108,.35); line-height: 1; }
  .under .t { font-size: 11px; letter-spacing: .28em; color: #5f584b; }
  #foil { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; transition: opacity .45s ease; }
  #foil.gone { opacity: 0; pointer-events: none; }
  .dc-tip { text-align: center; font-size: 11.5px; color: #8a8172; margin-top: 14px; letter-spacing: .08em; }
  .dc-sub { text-align: center; margin-top: 12px; }
  .dc-sub button { background: none; border: none; color: #8a7a5c; font-size: 11.5px; text-decoration: underline; text-underline-offset: 3px; padding: 6px; }

  /* 结果 */
  .result { border-radius: 22px; padding: 30px 22px; text-align: center; position: relative; overflow: hidden; animation: appear .6s cubic-bezier(.2,.8,.25,1) both; }
  @keyframes appear { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  .result.win {
    background: linear-gradient(160deg, #f7e2b3, #e2bd7c 45%, #c1954c);
    color: #2a1c08; box-shadow: 0 30px 70px -30px rgba(223,180,108,.45);
    padding-bottom: 56px;
  }
  .result.win::before {
    content: ""; position: absolute; inset: -40%;
    background: radial-gradient(circle at 50% 0%, rgba(255,255,255,.75), transparent 55%);
    animation: sheen 5s linear infinite;
  }
  @keyframes sheen { 0% { transform: translateY(-30%); } 100% { transform: translateY(30%); } }
  .result.win .r-inner { position: relative; z-index: 2; }
  .r-kicker { font-size: 10.5px; letter-spacing: .38em; opacity: .7; text-indent: .38em; }
  .r-prize { font-family: var(--font-display); font-size: 30px; line-height: 1.28; margin: 14px 0 8px; letter-spacing: .01em; }
  .r-name { font-size: 13px; opacity: .72; letter-spacing: .08em; }
  .r-line { width: 36px; height: 1px; background: currentColor; opacity: .35; margin: 20px auto; }
  .r-note { font-size: 11.5px; line-height: 1.9; opacity: .72; }
  .r-seal {
    position: absolute; right: 16px; bottom: 14px; width: 58px; height: 58px; border-radius: 50%;
    border: 1.5px solid rgba(42,28,8,.35); display: grid; place-items: center;
    font-family: var(--font-display); font-size: 15px; color: rgba(42,28,8,.55);
    transform: rotate(-12deg); line-height: 1.1; text-align: center; letter-spacing: .1em;
  }
  .result.none, .result.late, .result.void {
    background: #141418; border: 1px solid rgba(255,255,255,.08); padding: 42px 22px;
  }
  .result.none .r-title, .result.late .r-title, .result.void .r-title {
    font-family: var(--font-display); font-size: 26px; margin: 10px 0 8px; color: #e6dcc7;
  }
  .result p { font-size: 12.5px; color: #8e8575; line-height: 1.9; margin: 0; }
  .result .ic { font-size: 30px; opacity: .5; }

  /* 奖品列表 */
  .history { margin-top: 26px; }
  .history h3 { font-size: 10.5px; letter-spacing: .24em; color: #776e5f; font-weight: 500; margin: 0 0 10px; }
  .h-item {
    display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-radius: 11px;
    background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06); margin-bottom: 8px;
  }
  .h-item .hnm { font-size: 13px; color: #ddd2bd; }
  .h-item .hsub { font-size: 10.5px; color: #7d7464; margin-top: 2px; }
  .h-item .hb { margin-left: auto; font-size: 10px; color: #b6883f; }

  .p-foot { text-align: center; padding-top: 22px; font-size: 10.5px; color: #5e574b; letter-spacing: .06em; }
  .p-foot a { color: #7d7464; text-decoration: underline; text-underline-offset: 3px; }

  .loading { text-align: center; color: #6f6657; font-size: 12px; padding: 60px 0; letter-spacing: .18em; }

  .bar { position: fixed; left: 0; right: 0; top: 0; height: 2px; background: transparent; z-index: 30; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #cf4a37, #dfb46c); transition: width .4s; }
  .bar.on i { animation: load 1.2s ease-out forwards; }
  @keyframes load { to { width: 70%; } }

  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="bar" id="bar"><i></i></div>
<div class="phone">
  <header class="p-head">
    <div class="p-mark">幸</div>
    <div class="hn">LUCKY</div>
    <div class="an" id="actName">现场抽奖</div>
  </header>
  <main id="app"><div class="loading">正在连接现场…</div></main>
  <footer class="p-foot" id="foot"></footer>
</div>

<script src="/assets/app.js"></script>
<script>
(function () {
  const $ = (s) => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const codeParam = (params.get('c') || '').trim().toUpperCase();

  let act = null;
  let token = null;
  let st = null;
  let busy = false;
  let stream = null;
  let poll = null;
  let scratchCtx = null;
  let revealing = false;

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const tokenKey = () => `lucky.token.${act ? act.id : 'x'}`;

  function setFoot() {
    $('#foot').innerHTML = act
      ? `活动码 ${act.code} · 如信息有误请联系现场工作人员<br><a href="#" id="resetLink">换一位参与者</a>`
      : '';
    const link = document.getElementById('resetLink');
    if (link) link.onclick = (e) => {
      e.preventDefault();
      localStorage.removeItem(tokenKey());
      token = null;
      st = null;
      render();
    };
  }

  function render() {
    if (!act) return;
    $('#actName').textContent = act.name;
    setFoot();
    const app = $('#app');

    if (act.status === 'closed' && !st) {
      app.innerHTML = resultCard('void', '活动已结束', '感谢你的参与，中奖记录可在领奖处查询');
      return;
    }

    if (!st) {
      app.innerHTML = verifyView();
      bindVerify();
      return;
    }

    if (st.view === 'card') {
      app.innerHTML = cardView();
      bindScratch();
      return;
    }
    if (st.view === 'win') {
      app.innerHTML = winView();
      fireConfetti();
      return;
    }
    if (st.view === 'none') {
      app.innerHTML = resultCard('none', '谢谢参与', '本轮没有被抽中，下一轮还有机会<br>请留在现场等待主持人开启新一轮');
      return;
    }
    if (st.view === 'late') {
      app.innerHTML = resultCard('late', '本轮已开始', '你的验证时间晚于本轮开奖<br>下一轮开始时即可参与');
      return;
    }
    if (st.view === 'void') {
      app.innerHTML = resultCard('void', '名额已作废', '本轮名额出现异常，已由工作人员处理<br>如有疑问请联系现场工作人员');
      return;
    }
    app.innerHTML = waitingView();
  }

  function verifyView() {
    return `
      <div class="v-card">
        <div class="v-eyebrow">${LK.esc(act.name)}</div>
        <h1 class="v-title">验证身份<br>参与现场抽奖</h1>
        <p class="v-desc">请输入活动报名时登记的姓名与证件后四位，验证通过后即可参与抽奖。</p>
        <div class="v-err" id="vErr"></div>
        <div class="v-field">
          <label>姓名</label>
          <input class="v-input" id="vName" placeholder="请输入你的姓名" autocomplete="name" maxlength="20">
        </div>
        <div class="v-field">
          <label>证件后四位</label>
          <input class="v-input v-id" id="vId" placeholder="例如 1024" maxlength="4" autocomplete="off" autocapitalize="characters" inputmode="text">
        </div>
        <button class="v-btn" id="vSubmit">验证并进入</button>
        <div class="v-foot">信息仅用于现场核验身份，不作他用</div>
      </div>`;
  }

  function bindVerify() {
    const nameEl = $('#vName');
    const idEl = $('#vId');
    const btn = $('#vSubmit');
    idEl.addEventListener('input', () => {
      idEl.value = idEl.value.replace(/[^0-9a-zA-Z]/g, '').toUpperCase();
    });
    const submit = async () => {
      const name = nameEl.value.trim();
      const id4 = idEl.value.trim();
      const err = $('#vErr');
      if (!name) return showErr('请填写姓名');
      if (id4.length !== 4) return showErr('请填写证件后四位');

      btn.disabled = true;
      btn.textContent = '正在验证…';
      $('#bar').classList.add('on');
      try {
        const res = await LK.post('/api/join/verify', { code: act.code, name, id4 });
        token = res.token;
        localStorage.setItem(tokenKey(), token);
        st = await LK.get(`/api/join/state?token=${token}`);
        connectStream();
        render();
        if (res.firstTime && navigator.vibrate) navigator.vibrate(20);
      } catch (e) {
        showErr(e.message);
        btn.disabled = false;
        btn.textContent = '验证并进入';
        $('#bar').classList.remove('on');
      }
    };
    const showErr = (msg) => {
      const err = $('#vErr');
      err.textContent = msg;
      err.classList.add('on');
      if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
    };
    btn.onclick = submit;
    idEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    nameEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') idEl.focus(); });
  }

  function waitingView() {
    return `
      <div class="wait">
        <div class="ring"><i></i><i></i><i></i><b>${LK.esc(st.participant.name.slice(0, 1))}</b></div>
        <h2>已通过验证</h2>
        <p class="who"><b>${LK.esc(st.participant.name)}</b>${st.participant.dept ? ' · ' + LK.esc(st.participant.dept) : ''}</p>
        <p class="note">
          等待主持人开启本轮抽奖<br>
          <strong>请留在现场，不要关闭页面</strong>
        </p>
      </div>
      ${historyView()}`;
  }

  function cardView() {
    const r = st.round;
    return `
      <div class="draw-card">
        <div class="dc-top">
          <span class="dc-round">第 ${r.seq} 轮 · 抽奖卡</span>
          <span class="dc-prize">${LK.esc(r.prizeName)}</span>
        </div>
        <div class="scratch-stage" id="stage">
          <div class="under">
            <div class="q">？</div>
            <div class="t">用手指刮开涂层</div>
          </div>
          <canvas id="foil"></canvas>
        </div>
        <div class="dc-tip">刮开金色涂层，揭晓你与本轮奖项的缘分</div>
        <div class="dc-sub"><button id="revealDirect">刮不开？点此直接揭晓</button></div>
      </div>
      ${historyView()}`;
  }

  function winView() {
    const a = st.award || (st.history && st.history[0]) || {};
    return `
      <div class="result win">
        <div class="r-inner">
          <div class="r-kicker">CONGRATULATIONS</div>
          <div class="r-prize">${LK.esc(a.prizeName || '恭喜中奖')}</div>
          <div class="r-name">${LK.esc(st.participant.name)}${st.participant.dept ? ' · ' + LK.esc(st.participant.dept) : ''}</div>
          <div class="r-line"></div>
          <div class="r-note">中奖信息已同步至现场大屏<br>请凭此页面到领奖处登记领取</div>
        </div>
        <div class="r-seal">已<br>中奖</div>
      </div>
      ${historyView(true)}`;
  }

  function resultCard(kind, title, desc) {
    return `
      <div class="result ${kind}">
        <div class="ic">${kind === 'none' ? '○' : kind === 'late' ? '◔' : '×'}</div>
        <div class="r-title">${title}</div>
        <p>${desc}</p>
      </div>
      ${historyView()}`;
  }

  function historyView(skip) {
    if (!st || !st.history || !st.history.length) return '';
    return `
      <div class="history">
        <h3>我的中奖记录</h3>
        ${st.history.map((h) => `
          <div class="h-item">
            <div>
              <div class="hnm">${LK.esc(h.prizeName)}</div>
              <div class="hsub">第 ${h.roundSeq || '—'} 轮 · ${LK.fmtTime(h.revealedAt || h.assignedAt, true)}</div>
            </div>
            <div class="hb">${h.status === 'pending' ? '待揭晓' : '已中奖'}</div>
          </div>`).join('')}
      </div>`;
  }

  /* --------------------------- 刮卡 --------------------------- */

  function bindScratch() {
    const canvas = $('#foil');
    const stage = $('#stage');
    if (!canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const rect = stage.getBoundingClientRect();
    const W = rect.width;
    const H = rect.height;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    // 金色涂层
    const grad = ctx.createLinearGradient(0, 0, W, H);
    grad.addColorStop(0, '#e3c48d');
    grad.addColorStop(0.32, '#c9a05e');
    grad.addColorStop(0.52, '#efd6a4');
    grad.addColorStop(0.74, '#bc8f4d');
    grad.addColorStop(1, '#dcb87c');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 拉丝纹理
    ctx.globalAlpha = 0.16;
    for (let i = 0; i < 260; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? '#fff6df' : '#8a6023';
      ctx.fillRect(Math.random() * W, Math.random() * H, Math.random() * 26 + 4, 1);
    }
    // 噪点
    for (let i = 0; i < 900; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,250,235,.35)' : 'rgba(120,80,20,.18)';
      ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);
    }
    ctx.globalAlpha = 1;

    // 文字
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(72, 48, 12, .52)';
    ctx.font = '600 30px "Songti SC", serif';
    ctx.fillText('刮 开', W / 2, H / 2 - 6);
    ctx.font = '400 10px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(72, 48, 12, .42)';
    ctx.fillText(`LUCKY · 第 ${st.round.seq} 轮`, W / 2, H / 2 + 26);

    // 四角装饰
    ctx.strokeStyle = 'rgba(255,246,224,.55)';
    ctx.lineWidth = 1;
    const m = 12, len = 16;
    [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => {
      ctx.beginPath();
      ctx.moveTo(x, y + sy * len);
      ctx.lineTo(x, y);
      ctx.lineTo(x + sx * len, y);
      ctx.stroke();
    });

    scratchCtx = { ctx, canvas, W, H, dpr, done: false, drawing: false, last: null, checked: 0 };

    const pos = (e) => {
      const r = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - r.left, y: p.clientY - r.top };
    };

    const erase = (p) => {
      const ctx2 = scratchCtx.ctx;
      ctx2.globalCompositeOperation = 'destination-out';
      ctx2.beginPath();
      ctx2.arc(p.x, p.y, 24, 0, Math.PI * 2);
      ctx2.fill();
      if (scratchCtx.last) {
        // 连接两点，避免快速滑动出现断点
        const mid = { x: (p.x + scratchCtx.last.x) / 2, y: (p.y + scratchCtx.last.y) / 2 };
        ctx2.beginPath();
        ctx2.arc(mid.x, mid.y, 22, 0, Math.PI * 2);
        ctx2.fill();
      }
      scratchCtx.last = p;
      ctx2.globalCompositeOperation = 'source-over';
    };

    const check = () => {
      if (!scratchCtx || scratchCtx.done) return;
      const { ctx: c, W: w, H: h } = scratchCtx;
      let cleared = 0;
      let total = 0;
      const img = c.getImageData(0, 0, Math.floor(w * dpr), Math.floor(h * dpr)).data;
      const step = 16 * Math.floor(dpr);
      for (let y = 0; y < h * dpr; y += step) {
        for (let x = 0; x < w * dpr; x += step) {
          total++;
          if (img[(Math.floor(y) * Math.floor(w * dpr) + Math.floor(x)) * 4 + 3] < 40) cleared++;
        }
      }
      if (total && cleared / total > 0.42) {
        scratchCtx.done = true;
        reveal(false);
      }
    };

    const down = (e) => {
      e.preventDefault();
      if (!scratchCtx || scratchCtx.done) return;
      scratchCtx.drawing = true;
      erase(pos(e));
    };
    const move = (e) => {
      if (!scratchCtx || !scratchCtx.drawing || scratchCtx.done) return;
      e.preventDefault();
      erase(pos(e));
      scratchCtx.checked++;
      if (scratchCtx.checked % 6 === 0) check();
    };
    const up = () => {
      if (!scratchCtx) return;
      scratchCtx.drawing = false;
      scratchCtx.last = null;
      check();
    };

    canvas.addEventListener('pointerdown', down);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointerleave', up);
    canvas.addEventListener('pointercancel', up);
    $('#revealDirect').onclick = () => {
      if (scratchCtx) scratchCtx.done = true;
      reveal(true);
    };
  }

  async function reveal(force) {
    if (revealing) return;
    revealing = true;
    const canvas = $('#foil');
    try {
      if (canvas) canvas.classList.add('gone');
      if (navigator.vibrate) navigator.vibrate(force ? 10 : [15, 40, 25]);
      await sleep(force ? 120 : 420);
      const res = await LK.post('/api/join/scratch', { token, roundId: st.round.id });
      if (res.result === 'win') {
        st.view = 'win';
        st.award = res.award;
        st.history = [{ ...res.award, roundSeq: st.round.seq, status: 'revealed' }, ...(st.history || [])];
        render();
      } else if (res.result === 'none') {
        st.view = 'none';
        render();
      } else if (res.result === 'late') {
        st.view = 'late';
        render();
      } else if (res.result === 'void') {
        st.view = 'void';
        render();
      } else {
        st.view = 'none';
        render();
      }
    } catch (err) {
      LK.toast(err.message, 'err');
      revealing = false;
      if (canvas && !st.award) canvas.classList.remove('gone');
      if (scratchCtx) {
        scratchCtx.done = false;
        render();
      }
    }
  }

  /* --------------------------- 同步 --------------------------- */

  let refreshTimer = null;
  async function refresh() {
    if (!token || busy) return;
    try {
      const next = await LK.get(`/api/join/state?token=${token}`);
      const prevView = st && st.view;
      const prevRound = st && st.round && st.round.id;
      st = next;
      if (!prevView || prevView !== st.view || prevRound !== (st.round && st.round.id) || st.view === 'waiting' || st.view === 'late') {
        render();
      } else {
        setFoot();
      }
    } catch (err) {
      if (err.status === 401) {
        localStorage.removeItem(tokenKey());
        token = null;
        st = null;
        render();
      }
    }
  }

  function connectStream() {
    if (stream || !act) return;
    stream = LK.stream(act.id, (evt) => {
      if (evt.type === 'round.opened' || evt.type === 'round.closed' || evt.type === 'round.rolledback' || evt.type === 'award.void' || evt.type === 'award.assigned') {
        clearTimeout(refreshTimer);
        refreshTimer = setTimeout(refresh, 250);
      }
    });
  }

  /* --------------------------- 撒花 --------------------------- */

  const fx = document.getElementById('fx');
  const fctx = fx.getContext('2d');
  let parts = [];
  let fxRaf = null;

  function sizeFx() {
    fx.width = innerWidth * devicePixelRatio;
    fx.height = innerHeight * devicePixelRatio;
    fctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  sizeFx();
  addEventListener('resize', sizeFx);

  function fireConfetti() {
    const colors = ['#dfb46c', '#b6883f', '#cf4a37', '#f6f1e6', '#8e241a'];
    parts = Array.from({ length: 90 }, () => ({
      x: innerWidth / 2 + (Math.random() - 0.5) * 120,
      y: innerHeight * 0.28,
      vx: (Math.random() - 0.5) * 7,
      vy: -Math.random() * 8 - 2,
      g: 0.18,
      w: Math.random() * 6 + 3,
      h: Math.random() * 3 + 2,
      rot: Math.random() * 6,
      vr: (Math.random() - 0.5) * 0.3,
      c: colors[Math.floor(Math.random() * colors.length)],
      a: 1,
      stop: Date.now() + 2600,
    }));
    if (!fxRaf) fxLoop();
  }

  function fxLoop() {
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach((p) => {
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      if (Date.now() > p.stop) p.a -= 0.02;
      if (p.y > innerHeight + 30) p.a = 0;
      if (p.a <= 0) return;
      fctx.save();
      fctx.globalAlpha = p.a;
      fctx.translate(p.x, p.y);
      fctx.rotate(p.rot);
      fctx.fillStyle = p.c;
      fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      fctx.restore();
    });
    parts = parts.filter((p) => p.a > 0);
    if (parts.length) fxRaf = requestAnimationFrame(fxLoop);
    else {
      cancelAnimationFrame(fxRaf);
      fxRaf = null;
      fctx.clearRect(0, 0, innerWidth, innerHeight);
    }
  }

  /* --------------------------- 启动 --------------------------- */

  (async function init() {
    try {
      const qs = codeParam ? `?code=${encodeURIComponent(codeParam)}` : '';
      const res = await LK.get(`/api/join/activity${qs}`);
      act = res.activity;
      document.title = `${act.name} · 参与抽奖`;
      token = localStorage.getItem(tokenKey());
      if (token) {
        try {
          st = await LK.get(`/api/join/state?token=${token}`);
          if (st.activity.id !== act.id) {
            token = null;
            st = null;
          }
        } catch (e) {
          token = null;
          localStorage.removeItem(tokenKey());
        }
      }
      render();
      if (token) connectStream();
      poll = setInterval(() => {
        if (document.hidden) return;
        if (!st || ['waiting', 'late', 'card'].includes(st.view)) refresh();
      }, 4000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refresh();
      });
    } catch (e) {
      $('#app').innerHTML = `
        <div class="result void">
          <div class="ic">×</div>
          <div class="r-title">无法进入活动</div>
          <p>${LK.esc(e.message)}<br>请重新扫描现场二维码</p>
        </div>`;
    }
  })();
})();
</script>
</body>
